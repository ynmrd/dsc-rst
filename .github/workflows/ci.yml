name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: Linux (tests, clippy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Self-check (incl. real Discord API + gateway reachability)
        run: cargo run -p discord-native -- --self-check --network

  windows:
    name: Windows (tests, release, installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace
      - name: Release build
        run: cargo build --release -p discord-native
      - name: Self-check (incl. real Discord API + gateway reachability)
        run: target\release\discord-native.exe --self-check --network
      - name: Installer
        shell: pwsh
        run: |
          # windows-2025 (windows-latest) no longer ships NSIS; install it when missing.
          $candidates = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe")
          $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) {
            choco install nsis --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $makensis) { Write-Error "makensis.exe not found after installing NSIS"; exit 1 }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\discord-native.exe "dist\discord-native-$version-windows-x64.exe"
          & $makensis /V2 "/DVERSION=$version" "/DEXE=..\target\release\discord-native.exe" "/DOUTFILE=..\dist\DiscordNative-Setup-$version.exe" installer\discord-native.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sums = Get-ChildItem dist -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          $sums | Set-Content dist\SHA256SUMS.txt
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: discord-native-windows-x64
          path: dist/*
          if-no-files-found: error
