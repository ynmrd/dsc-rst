[package]
name = "discord-native"
description = "Discord Native: a native Rust desktop client for Discord built on official APIs"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "discord-native"
path = "src/main.rs"

[dependencies]
dn-core.workspace = true
dn-client.workspace = true
dn-ui.workspace = true
dn-settings.workspace = true
dn-diagnostics.workspace = true
eframe.workspace = true
tracing.workspace = true
anyhow.workspace = true

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Security"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
