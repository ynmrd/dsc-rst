[package]
name = "discord-native"
description = "Discord Native: a native Rust desktop client for Discord built on official APIs"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "discord-native"
path = "src/main.rs"

[dependencies]
dn-core.workspace = true
dn-cache.workspace = true
dn-client.workspace = true
dn-ui.workspace = true
dn-settings.workspace = true
dn-diagnostics.workspace = true
dn-media.workspace = true
dn-storage.workspace = true
dn-api.workspace = true
dn-auth.workspace = true
dn-audio.workspace = true
dn-gateway.workspace = true
eframe.workspace = true
egui.workspace = true
tokio.workspace = true
tracing.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
chrono.workspace = true

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile.workspace = true
